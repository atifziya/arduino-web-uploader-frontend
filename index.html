<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Cloud Uploader</title>
    
    <script>
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            console.log("Redirecting to HTTPS...");
            location.replace(`https:${location.href.substring(location.protocol.length)}`);
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>

    <script>
        // Global Error Handler for Scripts
        function loadScript(src, fallbackSrc) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = () => {
                    console.warn(`Primary source failed: ${src}. Trying fallback: ${fallbackSrc}`);
                    if (fallbackSrc) {
                        const fallback = document.createElement('script');
                        fallback.src = fallbackSrc;
                        fallback.onload = resolve;
                        fallback.onerror = reject;
                        document.head.appendChild(fallback);
                    } else {
                        reject();
                    }
                };
                document.head.appendChild(script);
            });
        }

        // Initialize App
        async function initApp() {
            const status = document.getElementById('output');
            
            try {
                // Step A: Load Buffer (Try unpkg first, then cdnjs)
                await loadScript(
                    'https://unpkg.com/buffer@6.0.3/index.js', 
                    'https://cdnjs.cloudflare.com/ajax/libs/buffer/6.0.3/buffer.min.js'
                );
                
                // Manual Buffer Attach
                if (window.buffer) window.Buffer = window.buffer.Buffer;
                
                // Backup Micro-Polyfill (Agar upar wale dono fail ho jayein)
                if (!window.Buffer) {
                    console.log("Using emergency fallback for Buffer");
                    window.Buffer = function(arg) { return new Uint8Array(arg); }; 
                    window.Buffer.from = function(arg) { return new Uint8Array(arg); };
                }

                // Step B: Process Polyfill
                window.process = { env: { DEBUG: undefined }, version: '1.0.0', nextTick: (cb) => setTimeout(cb, 0) };

                // Step C: Load Avrgirl (Try unpkg first, then jsdelivr)
                await loadScript(
                    'https://unpkg.com/avrgirl-arduino@3.0.0/dist/avrgirl-arduino.browser.min.js',
                    'https://cdn.jsdelivr.net/npm/avrgirl-arduino@3.0.0/dist/avrgirl-arduino.browser.min.js'
                );

                console.log("✅ All libraries loaded!");
                document.getElementById('loadingMsg').style.display = 'none';
            } catch (err) {
                console.error(err);
                status.textContent = "❌ CRITICAL: Libraries blocked by network. Try using a Mobile Hotspot.";
                status.style.background = "#e74c3c";
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #f4f7f6; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #2c3e50; font-size: 24px; }
        #editor { height: 400px; width: 100%; border: 1px solid #bdc3c7; border-radius: 4px; margin-bottom: 20px; }
        .status-box { padding: 15px; border-radius: 5px; margin-top: 20px; font-family: monospace; white-space: pre-wrap; background: #2c3e50; color: #ecf0f1; min-height: 80px; }
        .btn { padding: 12px 25px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; color: white; font-weight: 600; margin-right: 10px; }
        .btn-compile { background: #27ae60; } 
        .btn-upload { background: #2980b9; } 
        .btn:disabled { background: #95a5a6; cursor: not-allowed; }
        #loadingMsg { background: #f1c40f; color: #000; padding: 10px; text-align: center; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>☁️ Arduino Cloud Uploader (Secure)</h1>
    
    <div id="loadingMsg">⏳ Loading Libraries... Please wait...</div>

    <div id="editor">// Blink Code Example
void setup() {
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop() {
  digitalWrite(LED_BUILTIN, HIGH);
  delay(100);
  digitalWrite(LED_BUILTIN, LOW);
  delay(100);
}</div>

    <div>
        <button id="compileBtn" class="btn btn-compile" onclick="compileCode()">1. Compile on AWS</button>
        <button id="uploadBtn" class="btn btn-upload" disabled>2. Upload to Arduino</button>
    </div>

    <div id="output" class="status-box">Status: Ready to code...</div>
</div>

<script>
    // --- 1. Editor Setup ---
    const editor = ace.edit("editor");
    editor.setTheme("ace/theme/github");
    editor.session.setMode("ace/mode/c_cpp");

    // --- 2. Global Variables ---
    let hexData = null;
    const backendUrl = 'https://stemrobo.duckdns.org'; 

    // --- 3. Compile Function ---
    async function compileCode() {
        const code = editor.getValue();
        const output = document.getElementById('output');
        const compileBtn = document.getElementById('compileBtn');
        
        output.textContent = '⏳ Sending to AWS for compilation...';
        compileBtn.disabled = true;

        try {
            const response = await fetch(`${backendUrl}/compile`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });

            if (!response.ok) throw new Error(`Server Error: ${response.status}`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            
            hexData = data.hex;
            output.textContent = '✅ Compilation Success! HEX file received.\n👉 Ab "Upload to Arduino" button dabao.';
            document.getElementById('uploadBtn').disabled = false;
        } catch (err) {
            output.textContent = '❌ Compile Failed: ' + err.message;
        } finally {
            compileBtn.disabled = false;
        }
    }

    // --- 4. Upload Function ---
    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const output = document.getElementById('output');
        
        if (!hexData) { alert('Compile first!'); return; }
        
        if (typeof AvrgirlArduino === 'undefined') { 
            output.textContent = '❌ Error: Libraries failed to load. Check internet connection.'; 
            return; 
        }

        output.textContent = '🔌 Preparing upload...';

        // Convert HEX String -> Blob -> ArrayBuffer
        const fileBlob = new Blob([hexData], { type: 'application/octet-stream' });
        const fileReader = new FileReader();
        
        fileReader.onload = async function(event) {
            const fileBuffer = event.target.result;

            try {
                const avrgirl = new AvrgirlArduino({
                    board: 'uno', 
                    debug: true
                });

                output.textContent = '⏳ Popup aayega -> Arduino Select karo -> Connect dabao...';
                
                await avrgirl.flash(fileBuffer);
                
                output.textContent = '🚀 SUCCESS: Code Uploaded Successfully!';
            } catch (err) {
                output.textContent = '❌ Upload Error: ' + err.message;
                console.error(err);
            }
        };
        
        fileReader.readAsArrayBuffer(fileBlob);
    });
</script>

</body>
</html>
